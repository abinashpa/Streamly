services:
  # ==========================================
  # Infrastructure: PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: streamly-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamly_password}
      POSTGRES_DB: ${POSTGRES_DB:-streamly}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamly"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - streamly-net

  # ==========================================
  # Infrastructure: Redis Cache
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: streamly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - streamly-net

  # ==========================================
  # Infrastructure: Apache Kafka (KRaft Mode)
  # ==========================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: streamly-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamly-net

  # ==========================================
  # Infrastructure: OpenSearch Engine
  # ==========================================
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: streamly-opensearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - streamly-net

  # ==========================================
  # Microservice 1: User Service (Go + Gin + GORM)
  # ==========================================
  user-service:
    build:
      context: https://github.com/abinashpa/Streamly-user-service.git
      dockerfile: Dockerfile
    container_name: streamly-user-service
    restart: unless-stopped
    ports:
      - "8084:8084"
      - "50054:50054"
    environment:
      PORT: 8084
      GRPC_PORT: 50054
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-streamly}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-streamly_password}
      DB_NAME: streamly_users
      JWT_SECRET: ${JWT_SECRET:-streamly-super-secret-jwt-key}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - streamly-net

  # ==========================================
  # Microservice 2: Media Service (Go + Gin + GORM + Range Streamer)
  # ==========================================
  media-service:
    build:
      context: https://github.com/abinashpa/Streamly-media-service.git
      dockerfile: Dockerfile
    container_name: streamly-media-service
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "50051:50051"
    environment:
      PORT: 8081
      GRPC_PORT: 50051
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-streamly}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-streamly_password}
      DB_NAME: streamly_media
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      UPLOAD_DIR: /data/uploads
      SEARCH_SERVICE_URL: http://search-service:8083
      SEARCH_SERVICE_GRPC_ADDR: search-service:50053
      CATALOG_SERVICE_URL: http://catalog-service:8082
      BASE_URL: http://localhost:8081
    volumes:
      - media_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - streamly-net

  # ==========================================
  # Microservice 3: Catalog Service (Go + Gin + GORM + Redis Cache)
  # ==========================================
  catalog-service:
    build:
      context: https://github.com/abinashpa/Streamly-catalog-service.git
      dockerfile: Dockerfile
    container_name: streamly-catalog-service
    restart: unless-stopped
    ports:
      - "8082:8082"
      - "50052:50052"
    environment:
      PORT: 8082
      GRPC_PORT: 50052
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-streamly}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-streamly_password}
      DB_NAME: streamly_catalog
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      MEDIA_SERVICE_URL: http://media-service:8081
      MEDIA_SERVICE_GRPC_ADDR: media-service:50051
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - streamly-net

  # ==========================================
  # Microservice 4: Search Service (Go + Gin + OpenSearch)
  # ==========================================
  search-service:
    build:
      context: https://github.com/abinashpa/Streamly-search-service.git
      dockerfile: Dockerfile
    container_name: streamly-search-service
    restart: unless-stopped
    ports:
      - "8083:8083"
      - "50053:50053"
    environment:
      PORT: 8083
      GRPC_PORT: 50053
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_USER: admin
      OPENSEARCH_PASSWORD: admin
      INDEX_NAME: streamly_media
      KAFKA_BROKERS: kafka:9092
      MEDIA_SERVICE_URL: http://media-service:8081
      MEDIA_SERVICE_GRPC_ADDR: media-service:50051
      CATALOG_SERVICE_URL: http://catalog-service:8082
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - streamly-net

  # ==========================================
  # Microservice 5: GraphQL Service (Go + Gin + GraphQL)
  # ==========================================
  graphql-service:
    build:
      context: https://github.com/abinashpa/Streamly-graphql-service.git
      dockerfile: Dockerfile
    container_name: streamly-graphql-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      MEDIA_SERVICE_URL: http://media-service:8081
      MEDIA_SERVICE_GRPC_ADDR: media-service:50051
      CATALOG_SERVICE_URL: http://catalog-service:8082
      CATALOG_SERVICE_GRPC_ADDR: catalog-service:50052
      SEARCH_SERVICE_URL: http://search-service:8083
      SEARCH_SERVICE_GRPC_ADDR: search-service:50053
      USER_SERVICE_URL: http://user-service:8084
      USER_SERVICE_GRPC_ADDR: user-service:50054
    depends_on:
      - media-service
      - catalog-service
      - search-service
      - user-service
    networks:
      - streamly-net

  # ==========================================
  # API Gateway: Reverse Proxy & Router (Go + Gin)
  # ==========================================
  api-gateway:
    build:
      context: https://github.com/abinashpa/Streamly-api-gateway.git
      dockerfile: Dockerfile
    container_name: streamly-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      MEDIA_SERVICE_URL: http://media-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      SEARCH_SERVICE_URL: http://search-service:8083
      USER_SERVICE_URL: http://user-service:8084
      GRAPHQL_SERVICE_URL: http://graphql-service:8085
    depends_on:
      - user-service
      - media-service
      - catalog-service
      - search-service
      - graphql-service
    networks:
      - streamly-net

  # ==========================================
  # Frontend: Next.js + TypeScript + Tailwind + Prisma
  # ==========================================
  frontend:
    build:
      context: https://github.com/abinashpa/Streamly-frontend.git
      dockerfile: Dockerfile
    container_name: streamly-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-streamly}:${POSTGRES_PASSWORD:-streamly_password}@postgres:5432/streamly_frontend
      NEXT_PUBLIC_API_URL: http://localhost:8080
      API_GATEWAY_URL: http://api-gateway:8080
    depends_on:
      api-gateway:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - streamly-net

networks:
  streamly-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  opensearch_data:
  media_uploads:
